<?xml version="1.0" encoding="UTF-8"?>
<!--
  Favicon brand source: the original dotgrid diamond glyph on a white circular
  backing. The glyph path and scale are unchanged; only the square white tile
  has been replaced by a circle, with transparent corners around it.

  Consumed by generate.sh as the source for dist/public/favicon.png in every
  variant (the favicon is brand, not style-variant dependent).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <circle cx="600" cy="600" r="600" fill="#FFFFFF"/>
  <g transform="translate(600 600) scale(5.1) translate(-165 -165)">
    <path style="stroke-width: 15px; stroke-linecap: round; stroke-linejoin: round; stroke: rgb(0, 0, 0); fill: rgb(0, 0, 0);" d="M165,225 A60,60 0 0,0 225,165 A60,60 0 0,0 165,105 A60,60 0 0,0 105,165 L105,165 L105,225 L165,225 "/>
  </g>
</svg>
