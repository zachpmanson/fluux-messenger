<?xml version="1.0" encoding="UTF-8"?>
<!--
  Favicon brand source: white tile + a zoomed monochrome version of the
  round chat mark used by the app icon. The larger mark stays legible at
  favicon sizes while preserving the same circular body and tail silhouette.

  Consumed by generate.sh as the source for dist/public/favicon.png in every
  variant (the favicon is brand, not style-variant dependent).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <rect x="0" y="0" width="1024" height="1024" fill="#FFFFFF"/>
  <g fill="#000000">
    <circle cx="512" cy="510" r="283"/>
    <path d="M348 679 L278 897 L512 744 Z"/>
  </g>
</svg>
